map $http_x_forwarded_proto $margintra_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  location /api/ {
    proxy_pass http://api-nest:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $margintra_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /health/ { proxy_pass http://api-nest:8080; }
  location = /metrics { proxy_pass http://api-nest:8080; }
  location / { try_files $uri /index.html; }
}
