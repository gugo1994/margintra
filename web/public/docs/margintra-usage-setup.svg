<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Margintra usage integration example</title><desc id="desc">Sanitized illustration of onboarding Step 3 with Node.js and cURL tabs and a backend code example.</desc>
  <rect width="960" height="500" fill="#f5f7fb"/><rect x="100" y="35" width="760" height="430" rx="18" fill="#fff" stroke="#e3e7ef"/>
  <text x="140" y="83" fill="#4f46e5" font-family="Arial" font-size="12" font-weight="700">STEP 3 OF 5</text><text x="140" y="123" fill="#172033" font-family="Arial" font-size="26" font-weight="700">Add the SDK to your backend</text><text x="140" y="151" fill="#596579" font-family="Arial" font-size="14">Use the Node.js SDK or send the same usage data directly over HTTP.</text>
  <rect x="140" y="178" width="680" height="50" rx="9" fill="#eef2ff"/><text x="158" y="208" fill="#4338ca" font-family="Arial" font-size="13" font-weight="700">Backend code only</text><text x="284" y="208" fill="#596579" font-family="Arial" font-size="13">Never place the ingestion key in frontend browser code.</text>
  <rect x="140" y="250" width="680" height="180" rx="10" fill="#0f172a"/><rect x="140" y="250" width="680" height="44" rx="10" fill="#151f35"/><path d="M140 284h680v10H140z" fill="#151f35"/><rect x="154" y="258" width="76" height="29" rx="6" fill="#4f46e5"/><text x="192" y="277" fill="#fff" font-family="Arial" font-size="12" font-weight="700" text-anchor="middle">Node.js</text><text x="254" y="277" fill="#94a3b8" font-family="Arial" font-size="12">cURL</text><text x="766" y="277" fill="#a5b4fc" font-family="Arial" font-size="12">Copy</text>
  <g font-family="monospace" font-size="13"><text x="162" y="325" fill="#c084fc">await</text><text x="207" y="325" fill="#e5e7eb"> margintra.usage.</text><text x="348" y="325" fill="#f9a8d4">recordOpenAI</text><text x="450" y="325" fill="#cbd5e1">({</text><text x="180" y="352" fill="#7dd3fc">customerId</text><text x="265" y="352" fill="#cbd5e1">:</text><text x="281" y="352" fill="#86efac">'cus_123'</text><text x="180" y="379" fill="#7dd3fc">feature</text><text x="247" y="379" fill="#cbd5e1">:</text><text x="263" y="379" fill="#86efac">'support-chat'</text><text x="180" y="406" fill="#7dd3fc">occurredAt</text><text x="272" y="406" fill="#cbd5e1">:</text><text x="288" y="406" fill="#a5b4fc">new Date().toISOString()</text><text x="162" y="422" fill="#cbd5e1">});</text></g>
</svg>
