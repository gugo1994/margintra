<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Margintra webhook setup</title><desc id="desc">Sanitized illustration showing where to copy the Margintra webhook endpoint and paste the Stripe signing secret.</desc>
  <rect width="960" height="500" fill="#f5f7fb"/><rect x="48" y="36" width="864" height="428" rx="14" fill="#fff" stroke="#e3e7ef"/>
  <text x="82" y="84" fill="#172033" font-family="Arial" font-size="22" font-weight="700">Webhook setup</text><text x="82" y="111" fill="#596579" font-family="Arial" font-size="14">Add the Margintra endpoint to Stripe and save the signing secret.</text>
  <line x1="82" y1="138" x2="878" y2="138" stroke="#e3e7ef"/><circle cx="102" cy="180" r="17" fill="#eef2ff"/><text x="102" y="185" fill="#4f46e5" font-family="Arial" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="132" y="185" fill="#172033" font-family="Arial" font-size="16" font-weight="700">Add endpoint to Stripe</text>
  <text x="82" y="229" fill="#344054" font-family="Arial" font-size="13" font-weight="700">Margintra webhook endpoint</text><rect x="82" y="242" width="650" height="48" rx="8" fill="#f8fafc" stroke="#4f46e5" stroke-width="2"/><text x="98" y="272" fill="#596579" font-family="monospace" font-size="12">https://margin.example/api/v1/webhooks/stripe/••••••</text><rect x="746" y="242" width="112" height="48" rx="8" fill="#eef2ff"/><text x="802" y="271" fill="#4f46e5" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle">Copy URL</text>
  <line x1="82" y1="320" x2="878" y2="320" stroke="#e3e7ef"/><circle cx="102" cy="360" r="17" fill="#eef2ff"/><text x="102" y="365" fill="#4f46e5" font-family="Arial" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="132" y="365" fill="#172033" font-family="Arial" font-size="16" font-weight="700">Add signing secret</text>
  <rect x="82" y="390" width="650" height="48" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="2"/><text x="98" y="420" fill="#98a2b3" font-family="monospace" font-size="13">whsec_••••••••••••••••</text><rect x="746" y="390" width="112" height="48" rx="8" fill="#4f46e5"/><text x="802" y="419" fill="#fff" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle">Update secret</text>
</svg>
