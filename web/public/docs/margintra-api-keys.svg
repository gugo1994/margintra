<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Margintra Usage API keys</title><desc id="desc">Sanitized illustration of the Usage API keys table with create, rotate, and revoke actions and a one-time secret notice.</desc>
  <rect width="960" height="500" fill="#f5f7fb"/><rect x="48" y="34" width="864" height="432" rx="14" fill="#fff" stroke="#e3e7ef"/>
  <text x="80" y="81" fill="#172033" font-family="Arial" font-size="22" font-weight="700">Usage API keys</text><text x="80" y="108" fill="#596579" font-family="Arial" font-size="14">Authenticate server-side SDK and HTTP usage ingestion.</text><rect x="732" y="62" width="146" height="40" rx="8" fill="#4f46e5"/><text x="805" y="87" fill="#fff" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle">Create usage API key</text>
  <rect x="80" y="135" width="798" height="48" rx="8" fill="#fffbeb" stroke="#fde68a"/><text x="98" y="164" fill="#805d0b" font-family="Arial" font-size="13" font-weight="700">Shown once:</text><text x="184" y="164" fill="#596579" font-family="Arial" font-size="13">copy a new plaintext key immediately; Margintra stores only its hash.</text>
  <g font-family="Arial" font-size="11" font-weight="700" fill="#7c8799"><text x="80" y="224">NAME</text><text x="300" y="224">STATUS</text><text x="400" y="224">PREFIX</text><text x="540" y="224">LAST USED</text></g><line x1="80" y1="238" x2="878" y2="238" stroke="#e3e7ef"/>
  <text x="80" y="282" fill="#172033" font-family="Arial" font-size="14" font-weight="700">Production backend</text><rect x="296" y="260" width="66" height="26" rx="13" fill="#ecfdf3"/><text x="329" y="277" fill="#087b5b" font-family="Arial" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text><text x="400" y="280" fill="#596579" font-family="monospace" font-size="12">mtr_live_ab12…</text><text x="540" y="280" fill="#596579" font-family="Arial" font-size="13">Today, 10:42</text><rect x="688" y="256" width="86" height="34" rx="7" fill="#fff" stroke="#c7d2fe"/><text x="731" y="277" fill="#4f46e5" font-family="Arial" font-size="12" font-weight="700" text-anchor="middle">Rotate key</text><rect x="784" y="256" width="76" height="34" rx="7" fill="#fff" stroke="#fecaca"/><text x="822" y="277" fill="#ef5b5b" font-family="Arial" font-size="12" font-weight="700" text-anchor="middle">Revoke</text>
  <line x1="80" y1="309" x2="878" y2="309" stroke="#e3e7ef"/><text x="80" y="353" fill="#7c8799" font-family="Arial" font-size="14">Previous backend</text><rect x="296" y="331" width="72" height="26" rx="13" fill="#f2f4f7"/><text x="332" y="348" fill="#7c8799" font-family="Arial" font-size="10" font-weight="700" text-anchor="middle">REVOKED</text><text x="400" y="351" fill="#98a2b3" font-family="monospace" font-size="12">mtr_live_xy98…</text><text x="540" y="351" fill="#98a2b3" font-family="Arial" font-size="13">Aug 24, 14:10</text>
  <rect x="80" y="393" width="798" height="44" rx="8" fill="#eef2ff"/><text x="98" y="420" fill="#4338ca" font-family="Arial" font-size="13">Rotation revokes the old key and displays the replacement secret exactly once.</text>
</svg>
