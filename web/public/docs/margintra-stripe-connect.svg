  <text x="270" y="253" fill="#344054" font-family="Arial" font-size="13" font-weight="700">Stripe restricted key</text><rect x="270" y="266" width="610" height="48" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="2"/><text x="287" y="296" fill="#7c8799" font-family="monospace" font-size="14">rk_live_••••••••••••••••</text>
