<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Connect Stripe in Margintra</title><desc id="desc">Sanitized illustration of the Margintra Stripe connection form with a restricted key field.</desc>
