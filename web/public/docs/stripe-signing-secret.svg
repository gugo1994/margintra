  <text x="76" y="82" fill="#172033" font-family="Arial,sans-serif" font-size="24" font-weight="700">Margintra production</text><text x="76" y="112" fill="#10b981" font-family="Arial,sans-serif" font-size="14" font-weight="700">Enabled</text>
